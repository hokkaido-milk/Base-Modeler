name: CI

# Lint, build and run the Blender regression suite against the built ZIP.
# Also called by the release workflow before anything is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BLENDER_VERSION: "5.2.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check 'Base Modeler' tools tests
      - run: python -m ruff check 'Base Modeler' tools tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libglu1-mesa libice6 libsm6 libx11-6 libxext6 \
            libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1 xz-utils

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          name="blender-${BLENDER_VERSION}-linux-x64"
          curl -fsSL --retry 3 -o blender.tar.xz \
            "https://download.blender.org/release/Blender${series}/${name}.tar.xz"
          mkdir -p ~/blender
          tar -xJf blender.tar.xz -C ~/blender --strip-components=1
          rm blender.tar.xz

      - name: Run checks
        run: |
          ~/blender/blender --version
          python tools/run_checks.py --full --blender ~/blender/blender

      - name: Upload build and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: |
            dist/
            artifacts/validation/*.log
            artifacts/validation/suite.json
          if-no-files-found: ignore
